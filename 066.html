<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>毛遂自薦：自己站出來</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#e3e6f2;--ink:#1f2236;--sub:#575b78;--card:#f1f3fa;--ground:#b9bfd9;--acc:#3b4a9a;--red:#c23b2e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171a2b;--ink:#e8eaf6;--sub:#a4a9c6;--card:#20243a;--ground:#3a4064;--acc:#8d9cf0;--red:#ef6a5c}}
:root[data-theme="dark"]{--bg:#171a2b;--ink:#e8eaf6;--sub:#a4a9c6;--card:#20243a;--ground:#3a4064;--acc:#8d9cf0;--red:#ef6a5c}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;line-height:1.8;padding:20px 18px 48px}
main{max-width:560px;margin:0 auto}
.back{display:inline-block;color:var(--sub);text-decoration:none;min-height:40px;padding:6px 0}
.back:hover{text-decoration:underline}
h1{font-size:2.6rem;font-weight:900;letter-spacing:.12em;margin:8px 0 4px;line-height:1.2}
.lead{color:var(--sub);margin:0 0 14px}
.stage{background:var(--card);border-radius:14px;padding:16px 12px 8px}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:8px;justify-items:center;padding:6px 4px 10px;border-bottom:4px solid var(--ground)}
.slot{width:28px;height:28px;border-radius:50%;border:2px dashed var(--ground);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.95rem}
.slot.on{background:var(--c);border:2px solid transparent;animation:pop .4s ease-out}
.slot.mao{background:#e0b341;color:#2a2112;border-color:#e0b341}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.bub{text-align:center;min-height:2.2em;font-weight:900;color:var(--red);visibility:hidden;margin:8px 0 0}
.bub.on{visibility:visible;animation:pop .4s ease-out}
.label{text-align:center;color:var(--sub);font-size:.9rem;margin:6px 0 2px}
.ctrl{display:flex;gap:10px;margin:16px 0 4px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:12px 18px;min-height:46px}
button:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.add{flex:1;background:var(--ink);color:var(--bg);font-weight:900;font-size:1.05rem}
.add:disabled{opacity:.35;cursor:default}
.reset{background:transparent;color:var(--sub);border:1px solid var(--sub)}
.say{min-height:3.6em;margin:10px 0 0;font-size:1.02rem}
.stamp{display:none;border:3px solid var(--red);color:var(--red);font-weight:900;font-size:1.5rem;letter-spacing:.2em;padding:6px 14px;margin:8px auto 0;width:max-content;border-radius:6px;transform:rotate(-4deg)}
.stamp.on{display:block;animation:slam .35s ease-out}
@keyframes slam{from{transform:scale(2.2) rotate(-4deg);opacity:0}to{transform:scale(1) rotate(-4deg);opacity:1}}
h2{font-size:1.25rem;margin:36px 0 8px}
.parts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:baseline;margin:0}
.parts dt{font-weight:900;font-size:1.5rem;color:var(--acc)}
.parts dd{margin:0}
.q{margin:14px 0}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.opts button{background:var(--card);color:var(--ink);border:1px solid var(--sub)}
.opts button.ok{background:var(--acc);color:#fff;border-color:var(--acc)}
.opts button.no{background:var(--red);color:#fff;border-color:var(--red)}
@media (prefers-color-scheme:dark){.opts button.ok{color:#14172a}}
.fb{min-height:1.8em;color:var(--sub);margin:4px 0 0}
.vbtn{background:var(--card);color:var(--ink);border:1px solid var(--sub);margin:0 0 14px}
.vbtn[aria-pressed="true"]{background:var(--acc);color:#fff;border-color:var(--acc)}
.pass{display:none;text-align:center;margin:24px 0 8px}
.pass.on{display:block}
.pstamp{display:inline-block;border:4px solid var(--red);color:var(--red);font-weight:900;font-size:2.4rem;letter-spacing:.2em;padding:6px 20px 6px 28px;border-radius:8px;transform:rotate(-6deg);animation:slam2 .5s ease-out}
@keyframes slam2{from{transform:scale(2.4) rotate(-6deg);opacity:0}to{transform:scale(1) rotate(-6deg);opacity:1}}
.pass p{font-weight:900;font-size:1.15rem;margin:14px 0 0}
.leaf{position:fixed;top:-30px;font-size:24px;pointer-events:none;z-index:9;animation:leaf 2.8s linear forwards}
@keyframes leaf{to{transform:translateY(112vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
<a class="back" href="index.html">← 回成語列表</a>
<h1>毛遂自薦</h1>
<p class="lead">平原君缺一位門客，誰會站出來？點按鈕看看。</p>
<button class="vbtn" id="vbtn" aria-pressed="false">🔈 開啟語音解說</button>

<section class="stage" aria-label="動畫">
  <div class="grid" id="grid" aria-hidden="true"></div>
  <p class="bub" id="bub">🙋 我自己推薦自己！</p>
  <p class="label" id="count">已選門客：0 / 20 位</p>
</section>

<div class="ctrl">
  <button class="add" id="add">選一些門客</button>
  <button class="reset" id="reset">重來</button>
</div>
<p class="say" id="say">平原君在挑人。</p>
<div class="stamp" id="stamp">毛遂自薦</div>

<h2>拆開來看</h2>
<dl class="parts">
  <dt>毛遂</dt><dd>戰國時代平原君的門客</dd>
  <dt>自薦</dt><dd>自己推薦自己</dd>
</dl>
<p>合起來：比喻自告奮勇，自我推薦。例如主動向老師報名當義工。</p>

<h2>小測驗</h2>
<div class="q" data-a="0" data-w="再想想，毛遂自薦就是不等別人挑，自己主動站出來推薦自己。">
  <div>「小明主動報名班上的演講比賽。」可以說他是毛遂自薦嗎？</div>
  <div class="opts"><button data-i="0">可以</button><button data-i="1">不可以</button></div>
  <div class="fb"></div>
</div>
<div class="q" data-a="0" data-w="再想想，薦是推薦的意思，自薦就是自己推薦自己。">
  <div>「自薦」的「薦」是什麼意思？</div>
  <div class="opts"><button data-i="0">推薦</button><button data-i="1">拜見</button></div>
  <div class="fb"></div>
</div>

<div class="pass" id="pass" aria-live="polite"><div class="pstamp">通過</div><p>好棒！你已經學會「毛遂自薦」了。</p></div>
</main>

<script>
var grid=document.getElementById("grid"),bub=document.getElementById("bub"),cnt=document.getElementById("count"),
    say=document.getElementById("say"),stamp=document.getElementById("stamp"),add=document.getElementById("add"),n=0;
var cols=["#3b6fb0","#d28a2a","#2f9a8a","#c4607f","#6a55b8","#5a8f3a"],K=[5,10,15,19,20];
var T=["平原君要去楚國求救，需要二十位門客一起去。先選了五位。","又選了五位，一共十位。","再選五位，一共十五位。","選到十九位，剩下的人都不合適，還缺一位。","這時，毛遂舉手說：「我自己推薦自己！」他補上最後一個位子。這就是「毛遂自薦」。"];
var V=T.slice(0,4).concat(["這時，毛遂舉手說：我自己推薦自己！他補上最後一個位子。這就是毛遂自薦。意思是，自告奮勇，自我推薦。"]);
function build(){
  grid.innerHTML="";for(var i=0;i<20;i++){var d=document.createElement("div");d.className="slot";grid.appendChild(d)}
  n=0;bub.classList.remove("on");cnt.textContent="已選門客：0 / 20 位";
  say.textContent="平原君在挑人。";stamp.classList.remove("on");add.disabled=false;add.textContent="選一些門客";
}
add.addEventListener("click",function(){
  if(n>=5)return;
  var k=K[n],sl=grid.children;
  for(var i=0;i<k;i++){if(!sl[i].classList.contains("on")&&!sl[i].classList.contains("mao")){
    if(i==19){sl[i].className="slot on mao";sl[i].textContent="遂"}else{sl[i].classList.add("on");sl[i].style.setProperty("--c",cols[i%cols.length])}}}
  n++;
  cnt.textContent="已選門客："+k+" / 20 位";
  say.textContent=T[n-1];speak(V[n-1]);
  if(n==4)add.textContent="有人舉手！";
  if(n==5){bub.classList.add("on");stamp.classList.add("on");add.disabled=true}
});
document.getElementById("reset").addEventListener("click",function(){if(TTS)speechSynthesis.cancel();build()});

var voiceOn=false,vc=null,TTS=!!window.speechSynthesis;
function pick(){if(!TTS)return;var v=speechSynthesis.getVoices();var zh=v.filter(function(x){return /zh[-_](TW|Hant)/i.test(x.lang)});if(!zh.length)zh=v.filter(function(x){return /^zh/i.test(x.lang)});var bad=/zhiwei|danny|yunjhe|yunjie|\bmale\b|男/i,good=/meijia|mei-jia|yating|hanhan|female|女|google/i;vc=zh.filter(function(x){return good.test(x.name)&&!bad.test(x.name)})[0]||zh.filter(function(x){return !bad.test(x.name)})[0]||zh[0]||null}
function speak(t){if(!voiceOn||!TTS)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="zh-TW";if(vc)u.voice=vc;u.rate=.9;u.pitch=1.15;speechSynthesis.speak(u)}
if(TTS){pick();speechSynthesis.onvoiceschanged=pick}
function confetti(){if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;for(var i=0;i<24;i++){var l=document.createElement("span");l.className="leaf";l.textContent="🍃";l.style.left=Math.random()*100+"vw";l.style.animationDelay=Math.random()+"s";document.body.appendChild(l);setTimeout(function(e){e.remove()}.bind(null,l),4500)}}
var vbtn=document.getElementById("vbtn");
vbtn.addEventListener("click",function(){
  if(!TTS){say.textContent="這個畫面不支援語音，請把連結複製到 Chrome 瀏覽器開啟。";return}
  voiceOn=!voiceOn;vbtn.setAttribute("aria-pressed",voiceOn);
  vbtn.textContent=voiceOn?"🔊 語音解說：開":"🔈 開啟語音解說";
  if(voiceOn){pick();speak("你好呀，今天我們來認識一個成語，毛遂自薦。平原君想挑二十位門客，按下按鈕，看看最後缺了誰吧。")}else{speechSynthesis.cancel()}
});
document.querySelectorAll(".q").forEach(function(q){
  q.querySelectorAll("button").forEach(function(b){
    b.addEventListener("click",function(){
      var ok=b.dataset.i===q.dataset.a;
      q.querySelectorAll("button").forEach(function(x){x.classList.remove("ok","no")});
      b.classList.add(ok?"ok":"no");
      var m=ok?"答對了！":q.dataset.w;q.querySelector(".fb").textContent=m;
      if(ok)q.dataset.done="1";
      var ps=document.getElementById("pass"),all=[].every.call(document.querySelectorAll(".q"),function(x){return x.dataset.done});
      if(ok&&all&&!ps.classList.contains("on")){ps.classList.add("on");ps.scrollIntoView({behavior:"smooth",block:"center"});confetti();speak("太棒了，兩題都答對了！你已經學會比肩繼踵，通過囉！")}else{speak(m)}
    });
  });
});
build();
</script>
</body>
</html>
